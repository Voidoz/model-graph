[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelgraph"
version = "0.4.0"
description = "Compose small language models into a routed, observable graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]

[project.scripts]
mg = "modelgraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires a running local Ollama server"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/modelgraph/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.hatch.envs.default]
dependencies = ["pytest"]
