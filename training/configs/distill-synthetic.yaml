# Runnable offline distillation rehearsal (CPU, deterministic).
#
# This does not call a teacher. It treats the recorded node outputs in the T-0023 demo
# dataset as "teacher samples", applies the documented filter (labels, minimum length,
# exact-duplicate output), and runs the same synthetic student pipeline. It proves the
# filtering/provenance/card shape; it is not a distillation quality result.
#
#   uv run python training/scripts/build_specialist_demo_dataset.py --seed 20261025 --count 40 --force
#   uv run mg train specialist --config training/configs/distill-synthetic.yaml --eval
schema: modelgraph/specialist-training-config/v0
name: js-specialist offline distillation rehearsal
method: distill
mode: synthetic
dataset: runs/training/specialist-dataset
node: js-specialist
output_dir: runs/training/js-specialist-distill-synthetic
seed: 20261025
created_at: "2026-10-25T00:00:00Z"
notes: >-
  Teacher calls: zero. Samples are recorded dataset outputs, filtered deterministically. This is
  a pipeline rehearsal, not evidence that distillation improves the node.
model:
  id: js-specialist-distill-synthetic
  name: JavaScript Specialist (distillation rehearsal)
  version: 0.1.0
  description: >-
    A deterministic CPU rehearsal of the offline-distillation artifact pipeline. It contains
    pseudo-values, is not usable for inference, and must never be promoted.
  base: Qwen/Qwen2.5-Coder-3B-Instruct
  base_uri: hf://Qwen/Qwen2.5-Coder-3B-Instruct
  base_license: apache-2.0
  provider: mock
  model: synthetic-specialist://js-specialist-distill@0.1.0
  context_window: 32768
  max_output_tokens: 2048
  capabilities: [chat]
  labels:
    role: worker
    domain: coding
    language: javascript
    method: distill
  resources:
    ram_gb: 0.2
    disk_gb: 0.1
    cpu_only: true
    network_access: none
hyperparameters:
  rank: 16
  alpha: 32
  dropout: 0.05
  learning_rate: 0.0002
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 16
  max_seq_length: 2048
  quantization: none
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  optimizer: paged_adamw_8bit
  scheduler: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: true
  notes: Mirrors the 8GB recipe shape.
hardware:
  tier: cpu
  gpu: CPU only (no CUDA driver in this environment)
  vram_gb: 0
  cpu_only: true
  notes: Deterministic Python; no teacher sampling and no optimizer step.
  expected_data: 40 synthetic examples in the demo; 2,000-20,000 for a real distilled set.
  expected_runtime: seconds for the rehearsal.
distillation:
  teacher: recorded-dataset-output
  teacher_license: CC0-1.0
  filter: recorded
  min_bytes: 40
  include_failures: false
  notes: >-
    Offline rehearsal: the "teacher" is the recorded node output in the dataset. No teacher
    model, network call, or teacher quality is involved.
evaluation:
  node_suite: evals/mock/js-specialist
  node_graph: examples/coding-specialist.graph.yaml
  node: js-specialist
  graph_suite: evals/e2e/coding-specialist
  graph_graph: examples/coding-specialist.graph.yaml
  provider: mock
  reports_dir: runs/training/js-specialist-distill-synthetic/eval/runs
promotion:
  require_passing_eval: true
