    p95: 7000
  resources:
    vram_gb: 6
    ram_gb: 12
    disk_gb: 4.7
    cpu_only: true
    network_access: loopback
  license:
    name: apache-2.0
    url: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct
    weights_uri: hf://Qwen/Qwen2.5-Coder-7B-Instruct
