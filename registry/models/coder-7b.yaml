apiVersion: modelgraph/v0
kind: Model
metadata:
  id: coder-7b
  name: General Coding Model
  version: 1.0.0
  description: A general-purpose coding model for implementation, explanation, and cross-language work.
  labels:
    role: worker
    domain: coding
  authors:
    - Model Graph contributors
spec:
