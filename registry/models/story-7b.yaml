# Tutorial model manifest. Install this tag in Ollama before a live run:
#   ollama pull mistral:7b-instruct

apiVersion: modelgraph/v0
kind: Model
metadata:
  id: story-7b
  name: Storytelling Model
  version: 1.0.0
  description: A general instruction-tuned model used for fiction, narrative, and poetry.
  labels:
    role: worker
    domain: writing
  authors:
    - Model Graph contributors
spec:
  provider: ollama
  model: mistral:7b-instruct
  endpoint: http://127.0.0.1:11434
  context_window: 8192
  max_output_tokens: 4096
  capabilities: [chat]
  limits:
    default_temperature: 0.8
    default_max_output_tokens: 2048
    timeout_seconds: 180
  cost:
    pricing: free
    input_per_million_usd: 0
    output_per_million_usd: 0
    notes: Local inference; no marginal API cost.
  latency_ms:
    p50: 2000
    p95: 8000
  resources:
    vram_gb: 6
    ram_gb: 12
    disk_gb: 4.1
    cpu_only: true
    network_access: loopback
  license:
    name: apache-2.0
    url: https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3
    weights_uri: hf://mistralai/Mistral-7B-Instruct-v0.3
    commercial_use: true
    redistribution: true
    notes: Example manifest. Confirm the upstream license before redistribution.
  integrity:
    sha256: null
    revision: ollama:mistral:7b-instruct
  notes: Illustrative manifest. Context limit is conservative for the Ollama default.
