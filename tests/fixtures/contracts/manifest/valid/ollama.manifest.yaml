apiVersion: modelgraph/v0
kind: Model
metadata:
  id: fixture-ollama
  name: Fixture Ollama Model
  version: 0.3.0
  description: A local Ollama manifest that exercises the optional contract fields.
  labels:
    role: worker
    domain: fixtures
  authors:
    - Contract fixture corpus
spec:
  provider: ollama
  model: qwen2.5:1.5b-instruct
  endpoint: http://127.0.0.1:11434
  context_window: 32768
  max_output_tokens: 1024
  capabilities: [chat, json_mode, seeded]
  limits:
    default_temperature: 0.0
    default_max_output_tokens: 512
    timeout_seconds: 60
  cost:
    pricing: free
    input_per_million_usd: 0
    output_per_million_usd: 0
    notes: Local inference; no marginal API cost.
  latency_ms:
    p50: 250
    p95: 900
  resources:
    vram_gb: 2
    ram_gb: 4
    disk_gb: 1.2
    cpu_only: true
    network_access: loopback
  license:
    name: apache-2.0
    url: https://example.invalid/license
    weights_uri: hf://example/model
    commercial_use: true
    redistribution: true
    notes: Fixture license metadata only.
  integrity:
    sha256: null
    revision: ollama:qwen2.5:1.5b-instruct
    verified_at: "2026-10-22"
  eval:
    suite: fixture-suite
    report: runs/fixture-report.json
    score: 0.75
    measured_at: "2026-10-22"
  notes: Fixture manifest; it does not describe a real model.
